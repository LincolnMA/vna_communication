[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"


[project]
name = "vna_driver"
version = "0.0.1"
authors = [
  { name="Gabriel Tomaz"},
{ name="Lincoln Machado"},
]
description = "A simple VNA driver"
requires-python = ">=3.9"
dependencies = [
    "pyserial==3.5",
    "customtkinter==5.2.2",
    "matplotlib==3.9.3"
]

[project.optional-dependencies]
dev = [
    "pytest"
]
